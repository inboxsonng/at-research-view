</style></head><body><header>AUTO TRADER</header><main><h1>Auto Trader workspace</h1>

<noscript>Enable JavaScript to open the encrypted report.</noscript></main><script>

 const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

   field.value='';document.open();document.write(new TextDecoder().decode(bytes));document.close();
 }catch(error){
   status.textContent=error.name==='OperationError'?'Incorrect password. Try again.':'Unable to open the report. Reload and try again.';
   button.disabled=false;field.focus();field.select();
 }
});
