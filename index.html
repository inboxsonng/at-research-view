<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Guest access · Auto Trader</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#152840;font:16px/1.5 system-ui,sans-serif}
header{padding:11px 4%;background:#123768;color:white;border-bottom:3px solid #ff8428;font-weight:750;letter-spacing:.04em}
main{max-width:420px;margin:clamp(44px,10vh,96px) auto;padding:0 18px}
h1{font-size:28px;margin:0}p{margin:6px 0 20px;color:#46576c}label{font-weight:650}

input{margin:5px 0 14px;border:1px solid #90a4ba}button{color:white;background:#0758a4;border:0;cursor:pointer;font-weight:650}
:focus-visible{outline:3px solid #ff8428;outline-offset:2px}#status{color:#9b302b;margin:9px 0}
</style></head><body><header>AUTO TRADER</header><main><h1>Auto Trader workspace</h1>
<p>Enter the shared password to view capper profiles and paper results.</p>
<form id="unlock"><label for="password">Guest password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button>Open dashboard</button><p id="status" role="status"></p></form>
<noscript>Enable JavaScript to open the encrypted report.</noscript></main><script>
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
document.getElementById('unlock').addEventListener('submit',async event=>{
 event.preventDefault();
 const form=event.currentTarget, field=form.querySelector('input'), button=form.querySelector('button'), status=document.getElementById('status');
 if(button.disabled)return;
 button.disabled=true;status.textContent='Opening…';
 const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 try {
   const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode('HOUkph0Ygg2FpVVw9cuekQ=='),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
   const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode('UtilibgPKPBoZ/8g')},key,decode('s9P/xnQxCN77uXjrNOMXmk0sXcmUBatf6FV3bTaL/bIKQQZkpP5sUv+mqm0QH92wOTJNxp9DJN50w1resiHDl+zK0jdp2REw7Ik4j/rIt+zKpt56FucpIzWaHrIDXgyIjjPuL/sI3DX826DzN/cSYUjMN8O/gUpSiVz7MOL7pLhsRArE/ktjkHX1x4Ui5vCsoiOFd3E5TT1fTmaPs7b2HqXxaIiiAyMm89t+zw7hAmyIwfD6XKBiRex6a9GDusiSkQEwTSWRZfs25cu9N8hbwR/TZA7GMKEp96/SvqidGmxJ4IFcCCna5SpLIsJpC8rFX834X1Ze0Zp2PJhhB3fjG+RQyLIRsWcibsM/coOLl3oPyX0h/5AB82jY31HA/WR4Wdu//f7djbtpcNFERnmkaaZBDwZF6TVb7omi+tUOwBaFN5B6ZyBJFercfLQiy/0q6k0bimFDBkzGTr6n4kTR9L/H+C1mNv6cf7yHucE0ZrA47iOXJJ/v5tDxAJApz2ucmsmc8jwe+RQ5lGB8n6gjGbNXilZ1Eift1Qk5LCqjWCLMPNDd9J4t2ZNawlq0uhwv5s8ySKDzrmdYCFzgzBfxFdlPBFmxkAX1RWuDWHZ+JvpucXxxGXeZqzmekYUHUbIWk2J4B/VaV5nntlcN2lLw'));
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   field.value='';document.open();document.write(html);document.close();
 }catch(error){
   status.textContent=error.name==='OperationError'?'Incorrect password. Try again.':'Unable to open the report. Reload and try again.';
   button.disabled=false;field.focus();field.select();
 }
});
</script></body></html>
